flow_id: cancel_appointment
version: 1
status: candidate
description: Handles calls that run lookup_patient -> cancel_appointment.
entry:
  slots: [name]
  description: ''
  learned_guards:
  - path: slot.name
    kind: pattern
    values: [Aa Aa]
    support: 136
slots:
  name: {extractor: person_name, description: 'the caller''s full name, exactly as spoken'}
steps:
- id: s1
  kind: tool
  tool: lookup_patient
  side_effect: read_only
  args:
    name: {from: slot, slot: name}
  learned_guards:
  - path: args.name
    kind: pattern
    values: [Aa Aa]
    support: 136
  - path: output.found
    kind: enum
    values: [true]
    support: 136
  - {path: output.patient, kind: not_null, support: 136}
  - path: output.patient.first_name
    kind: pattern
    values: [Aa]
    support: 136
  - {path: output.patient.next_appointment, kind: not_null, support: 136}
  - path: output.patient.next_appointment.date
    kind: pattern
    values: ['9999-99-99']
    support: 136
  - path: output.patient.next_appointment.id
    kind: pattern
    values: [A9999]
    support: 136
  - path: output.patient.next_appointment.provider
    kind: enum
    values: [Dr. Kim, Dr. Lopez, Dr. Patel]
    support: 136
  - path: output.patient.next_appointment.time
    kind: pattern
    values: ['99:99']
    support: 136
  next: s2
- id: s2
  kind: confirm
  say: {template: 'Thanks, {steps.s1.output.patient.first_name}. I see your appointment on {steps.s1.output.patient.next_appointment.date|human_date} at {steps.s1.output.patient.next_appointment.time|human_time} with {steps.s1.output.patient.next_appointment.provider}. Shall I cancel it?', coverage: 1.0}
  on_yes: s3
  on_no: fallback
  inserted: false
- id: s3
  kind: tool
  tool: cancel_appointment
  side_effect: irreversible
  args:
    appointment_id: {from: output, step: s1, path: patient.next_appointment.id}
  learned_guards:
  - path: args.appointment_id
    kind: pattern
    values: [A9999]
    support: 136
  - path: output.cancelled
    kind: enum
    values: [true]
    support: 136
  next: s4
- id: s4
  kind: say
  say: {template: 'Your appointment on {steps.s1.output.patient.next_appointment.date|human_date} at {steps.s1.output.patient.next_appointment.time|human_time} has been cancelled. Is there anything else I can help you with?', coverage: 1.0}
  next: end
