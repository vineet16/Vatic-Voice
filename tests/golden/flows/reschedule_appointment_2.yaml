flow_id: reschedule_appointment_2
version: 1
status: candidate
description: Handles calls that run lookup_patient -> check_availability -> reschedule_appointment.
entry:
  slots: [name]
  description: ''
  learned_guards:
  - path: slot.name
    kind: pattern
    values: [Aa Aa]
    support: 28
slots:
  name: {extractor: person_name, description: 'the caller''s full name, exactly as spoken'}
  date: {extractor: date_phrase, description: a date phrase exactly as the caller said it (e.g. 'next Tuesday')}
  time: {extractor: time_phrase, description: a time phrase exactly as the caller said it (e.g. '2 pm')}
steps:
- id: s1
  kind: tool
  tool: lookup_patient
  side_effect: read_only
  args:
    name: {from: slot, slot: name}
  learned_guards:
  - path: args.name
    kind: pattern
    values: [Aa Aa]
    support: 28
  - path: output.found
    kind: enum
    values: [true]
    support: 28
  - {path: output.patient, kind: not_null, support: 28}
  - path: output.patient.first_name
    kind: pattern
    values: [Aa]
    support: 28
  - {path: output.patient.next_appointment, kind: not_null, support: 28}
  - path: output.patient.next_appointment.date
    kind: pattern
    values: ['9999-99-99']
    support: 28
  - path: output.patient.next_appointment.id
    kind: pattern
    values: [A9999]
    support: 28
  - path: output.patient.next_appointment.time
    kind: pattern
    values: ['99:99']
    support: 28
  next: s2
- id: s2
  kind: ask
  say: {template: 'Thanks, {steps.s1.output.patient.first_name}. Your current appointment is on {steps.s1.output.patient.next_appointment.date|human_date} at {steps.s1.output.patient.next_appointment.time|human_time}. What day would you like to move it to?', coverage: 1.0}
  membership: {residual_max_tokens: 0}
  next: s3
- id: s3
  kind: ask
  expects: [date]
  say: {template: 'Your current appointment is on {steps.s1.output.patient.next_appointment.date|human_date} at {steps.s1.output.patient.next_appointment.time|human_time}. What day would you like to move it to?', coverage: 1.0}
  membership: {residual_max_tokens: 0}
  next: s4
- id: s4
  kind: tool
  tool: check_availability
  side_effect: read_only
  args:
    date:
      from: transform
      fn: normalize_date
      input: {from: slot, slot: date}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 28
  - path: output.available
    kind: enum
    values: [true]
    support: 28
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 28
  - {path: output.times, kind: not_null, support: 28}
  - {path: output.times, kind: length, min: 1.0, max: 4.0, support: 28}
  next: s5
- id: s5
  kind: ask
  expects: [time]
  say: {template: 'On {steps.s4.output.date|human_date} I have {steps.s4.output.times|human_time_list}. Which time works best for you?', coverage: 1.0}
  learned_guards:
  - {path: slot.time, kind: member_of, container: steps.s4.output.times, fn: normalize_time, support: 28}
  membership: {residual_max_tokens: 0}
  next: s6
- id: s6
  kind: confirm
  say: {template: 'Just to confirm: move your appointment to {steps.s4.output.date|human_date} at {slot.time|normalize_time|human_time}. Shall I go ahead?', coverage: 1.0}
  on_yes: s7
  on_no: fallback
  inserted: false
- id: s7
  kind: tool
  tool: reschedule_appointment
  side_effect: reversible
  args:
    appointment_id: {from: output, step: s1, path: patient.next_appointment.id}
    date: {from: output, step: s4, path: date}
    time:
      from: transform
      fn: normalize_time
      input: {from: slot, slot: time}
  learned_guards:
  - path: args.appointment_id
    kind: pattern
    values: [A9999]
    support: 28
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 28
  - path: args.time
    kind: pattern
    values: ['99:99']
    support: 28
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 28
  - path: output.time
    kind: pattern
    values: ['99:99']
    support: 28
  - {path: args.time, kind: member_of, container: steps.s4.output.times, support: 28}
  next: s8
- id: s8
  kind: say
  say: {template: 'Done. Your appointment is now on {steps.s7.output.date|human_date} at {steps.s7.output.time|human_time}. Is there anything else I can help you with?', coverage: 1.0}
  next: end
provenance:
  support: 28
  sessions: [sim-11-00023, sim-11-00079, sim-11-00105, sim-11-00107, sim-11-00117, sim-11-00166, sim-11-00270, sim-11-00278, sim-11-00315, sim-11-00317, sim-11-00337, sim-11-00342, sim-11-00348, sim-11-00356, sim-11-00391, sim-11-00393, sim-11-00433, sim-11-00479, sim-11-00495, sim-11-00529, sim-11-00551, sim-11-00631, sim-11-00656, sim-11-00660, sim-11-00733, sim-11-00753, sim-11-00756, sim-11-00787]
  tool_signature: [lookup_patient, check_availability, reschedule_appointment]
  shape:
  - [lookup_patient]
  - []
  - [check_availability]
  - []
  - [reschedule_appointment]
  bindings:
    s1.args.name: {class: slot, support: 28}
    s4.args.date: {class: transform, support: 28}
    s7.args.appointment_id: {class: output, support: 28}
    s7.args.date: {class: output, support: 28}
    s7.args.time: {class: transform, support: 28}
content_hash: sha256:dd20fad2c45b5c3cae3337be8420b7667908e5ac120ceb9592805d802aa2705e
