flow_id: book_appointment_4
version: 1
status: candidate
description: Handles calls that run lookup_patient -> check_availability -> book_appointment.
entry:
  slots: [name]
  description: ''
  learned_guards:
  - path: slot.name
    kind: pattern
    values: [Aa Aa]
    support: 41
slots:
  name: {extractor: person_name, description: 'the caller''s full name, exactly as spoken'}
  date: {extractor: date_phrase, description: a date phrase exactly as the caller said it (e.g. 'next Tuesday')}
  time: {extractor: time_phrase, description: a time phrase exactly as the caller said it (e.g. '2 pm')}
steps:
- id: s1
  kind: tool
  tool: lookup_patient
  side_effect: read_only
  args:
    name: {from: slot, slot: name}
  learned_guards:
  - path: args.name
    kind: pattern
    values: [Aa Aa]
    support: 41
  - path: output.found
    kind: enum
    values: [true]
    support: 41
  - {path: output.patient, kind: not_null, support: 41}
  - path: output.patient.first_name
    kind: pattern
    values: [Aa]
    support: 41
  - path: output.patient.id
    kind: pattern
    values: [A9999]
    support: 41
  next: s2
- id: s2
  kind: ask
  say: {template: 'Thanks, {steps.s1.output.patient.first_name}. What day would you like to come in?', coverage: 1.0}
  membership: {residual_max_tokens: 0}
  next: s3
- id: s3
  kind: ask
  expects: [date]
  say: {template: 'We have openings most weekdays. What day works best for you?', coverage: 1.0}
  membership: {residual_max_tokens: 0}
  next: s4
- id: s4
  kind: tool
  tool: check_availability
  side_effect: read_only
  args:
    date:
      from: transform
      fn: normalize_date
      input: {from: slot, slot: date}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 41
  - path: output.available
    kind: enum
    values: [true]
    support: 41
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 41
  - {path: output.times, kind: not_null, support: 41}
  - {path: output.times, kind: length, min: 1.0, max: 4.0, support: 41}
  next: s5
- id: s5
  kind: ask
  expects: [time]
  say: {template: 'On {steps.s4.output.date|human_date} I have {steps.s4.output.times|human_time_list}. Which time works best for you?', coverage: 1.0}
  learned_guards:
  - {path: slot.time, kind: member_of, container: steps.s4.output.times, fn: normalize_time, support: 41}
  membership: {residual_max_tokens: 0}
  next: s6
- id: s6
  kind: confirm
  say: {template: 'Just to confirm: {steps.s4.output.date|human_date} at {slot.time|normalize_time|human_time}. Shall I book it?', coverage: 1.0}
  on_yes: s7
  on_no: fallback
  inserted: false
- id: s7
  kind: tool
  tool: book_appointment
  side_effect: irreversible
  args:
    date: {from: output, step: s4, path: date}
    patient_id: {from: output, step: s1, path: patient.id}
    time:
      from: transform
      fn: normalize_time
      input: {from: slot, slot: time}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 41
  - path: args.patient_id
    kind: pattern
    values: [A9999]
    support: 41
  - path: args.time
    kind: pattern
    values: ['99:99']
    support: 41
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 41
  - path: output.time
    kind: pattern
    values: ['99:99']
    support: 41
  - {path: args.time, kind: member_of, container: steps.s4.output.times, support: 41}
  next: s8
- id: s8
  kind: say
  say: {template: 'You''re all set, {steps.s1.output.patient.first_name}. Your appointment is on {steps.s7.output.date|human_date} at {steps.s7.output.time|human_time}. Is there anything else I can help you with?', coverage: 1.0}
  next: end
provenance:
  support: 41
  sessions: [sim-11-00008, sim-11-00016, sim-11-00029, sim-11-00033, sim-11-00034, sim-11-00039, sim-11-00041, sim-11-00083, sim-11-00086, sim-11-00103, sim-11-00104, sim-11-00133, sim-11-00176, sim-11-00227, sim-11-00247, sim-11-00299, sim-11-00327, sim-11-00329, sim-11-00350, sim-11-00358, sim-11-00361, sim-11-00390, sim-11-00392, sim-11-00424, sim-11-00434, sim-11-00477, sim-11-00484, sim-11-00501, sim-11-00522, sim-11-00581, sim-11-00643, sim-11-00676, sim-11-00678, sim-11-00691, sim-11-00698, sim-11-00706, sim-11-00726, sim-11-00771, sim-11-00778, sim-11-00779, sim-11-00791]
  tool_signature: [lookup_patient, check_availability, book_appointment]
  shape:
  - [lookup_patient]
  - []
  - [check_availability]
  - []
  - [book_appointment]
  bindings:
    s1.args.name: {class: slot, support: 41}
    s4.args.date: {class: transform, support: 41}
    s7.args.date: {class: output, support: 41}
    s7.args.patient_id: {class: output, support: 41}
    s7.args.time: {class: transform, support: 41}
