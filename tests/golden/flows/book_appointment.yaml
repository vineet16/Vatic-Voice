flow_id: book_appointment
version: 1
status: candidate
description: Handles calls that run lookup_patient -> check_availability -> book_appointment.
entry:
  slots: [name]
  description: ''
  learned_guards:
  - path: slot.name
    kind: pattern
    values: [Aa Aa]
    support: 181
slots:
  name: {extractor: person_name, description: 'the caller''s full name, exactly as spoken'}
  date: {extractor: date_phrase, description: a date phrase exactly as the caller said it (e.g. 'next Tuesday')}
  time: {extractor: time_phrase, description: a time phrase exactly as the caller said it (e.g. '2 pm')}
  date_2: {extractor: date_phrase, description: a date phrase exactly as the caller said it (e.g. 'next Tuesday')}
steps:
- id: s1
  kind: tool
  tool: lookup_patient
  side_effect: read_only
  args:
    name: {from: slot, slot: name}
  learned_guards:
  - path: args.name
    kind: pattern
    values: [Aa Aa]
    support: 249
  - path: output.found
    kind: enum
    values: [true]
    support: 249
  - {path: output.patient, kind: not_null, support: 249}
  - path: output.patient.first_name
    kind: pattern
    values: [Aa]
    support: 249
  - path: output.patient.id
    kind: pattern
    values: [A9999]
    support: 249
  next: s2
- id: s2
  kind: ask
  expects: [date]
  say: {template: 'Thanks, {steps.s1.output.patient.first_name}. What day would you like to come in?', coverage: 1.0}
  membership: {residual_max_tokens: 1}
  next: s3
- id: s3
  kind: tool
  tool: check_availability
  side_effect: read_only
  args:
    date:
      from: transform
      fn: normalize_date
      input: {from: slot, slot: date}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 249
  - path: output.available
    kind: enum
    values: [false, true]
    support: 249
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 249
  next: s3x
- id: s3x
  kind: branch
  cases:
  - {when: steps.s3.output.available == True, next: s4}
  - {when: steps.s3.output.available == False, next: s4b}
  default: fallback
- id: s4
  kind: ask
  expects: [time]
  say: {template: 'On {steps.s3.output.date|human_date} I have {steps.s3.output.times|human_time_list}. Which time works best for you?', coverage: 0.9834}
  learned_guards:
  - {path: slot.time, kind: member_of, container: steps.s3.output.times, fn: normalize_time, support: 181}
  membership: {residual_max_tokens: 0}
  next: s5
- id: s5
  kind: confirm
  say: {template: 'Just to confirm: {steps.s3.output.date|human_date} at {slot.time|normalize_time|human_time}. Shall I book it?', coverage: 0.9724}
  on_yes: s6
  on_no: fallback
  inserted: false
- id: s6
  kind: tool
  tool: book_appointment
  side_effect: irreversible
  args:
    date: {from: output, step: s3, path: date}
    patient_id: {from: output, step: s1, path: patient.id}
    time:
      from: transform
      fn: normalize_time
      input: {from: slot, slot: time}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 181
  - path: args.patient_id
    kind: pattern
    values: [A9999]
    support: 181
  - path: args.time
    kind: pattern
    values: ['99:99']
    support: 181
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 181
  - path: output.time
    kind: pattern
    values: ['99:99']
    support: 181
  - {path: args.time, kind: member_of, container: steps.s3.output.times, support: 181}
  next: s7
- id: s7
  kind: say
  say: {template: 'You''re all set, {steps.s1.output.patient.first_name}. Your appointment is on {steps.s6.output.date|human_date} at {steps.s6.output.time|human_time}. Is there anything else I can help you with?', coverage: 1.0}
  next: end
- id: s4b
  kind: ask
  expects: [date_2]
  say: {template: 'Sorry, we have no openings on {steps.s3.output.date|human_date}. Is there another day that works for you?', coverage: 1.0}
  membership: {residual_max_tokens: 0}
  next: s5b
- id: s5b
  kind: tool
  tool: check_availability
  side_effect: read_only
  args:
    date:
      from: transform
      fn: normalize_date
      input: {from: slot, slot: date_2}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 68
  - path: output.available
    kind: enum
    values: [true]
    support: 68
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 68
  - {path: output.times, kind: not_null, support: 68}
  - {path: output.times, kind: length, min: 1.0, max: 4.0, support: 68}
  next: s6b
- id: s6b
  kind: ask
  expects: [time]
  say: {template: 'On {steps.s5b.output.date|human_date} I have {steps.s5b.output.times|human_time_list}. Which time works best for you?', coverage: 1.0}
  learned_guards:
  - {path: slot.time, kind: member_of, container: steps.s5b.output.times, fn: normalize_time, support: 68}
  membership: {residual_max_tokens: 0}
  next: s7b
- id: s7b
  kind: confirm
  say: {template: 'Just to confirm: {steps.s5b.output.date|human_date} at {slot.time|normalize_time|human_time}. Shall I book it?', coverage: 0.9853}
  on_yes: s8b
  on_no: fallback
  inserted: false
- id: s8b
  kind: tool
  tool: book_appointment
  side_effect: irreversible
  args:
    date: {from: output, step: s5b, path: date}
    patient_id: {from: output, step: s1, path: patient.id}
    time:
      from: transform
      fn: normalize_time
      input: {from: slot, slot: time}
  learned_guards:
  - path: args.date
    kind: pattern
    values: ['9999-99-99']
    support: 68
  - path: args.patient_id
    kind: pattern
    values: [A9999]
    support: 68
  - path: args.time
    kind: pattern
    values: ['99:99']
    support: 68
  - path: output.date
    kind: pattern
    values: ['9999-99-99']
    support: 68
  - path: output.time
    kind: pattern
    values: ['99:99']
    support: 68
  - {path: args.time, kind: member_of, container: steps.s5b.output.times, support: 68}
  next: s9b
- id: s9b
  kind: say
  say: {template: 'You''re all set, {steps.s1.output.patient.first_name}. Your appointment is on {steps.s8b.output.date|human_date} at {steps.s8b.output.time|human_time}. Is there anything else I can help you with?', coverage: 1.0}
  next: end
