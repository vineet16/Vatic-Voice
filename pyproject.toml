[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vatic"
version = "0.1.0"
description = "Learn recurring LLM call flows, compile them into deterministic guarded graphs, fall back to the LLM off-path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
livekit = ["livekit-agents==1.8.4"]
pipecat = ["pipecat-ai==1.12.0"]
classifier = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.26"]
bench = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
vatic = "vatic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vatic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_debug = true
markers = ["slow: long-running simulation tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "ASYNC109", "UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["vatic/core", "vatic/compiler", "vatic/ir", "vatic/trace"]
strict = true
